apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: secure-cloud-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:18


          securityContext:
            appArmorProfile:
              type: Unconfined

            runAsUser: 999
            runAsGroup: 999

          env:
            - name: POSTGRES_USER
              value: todo_user
            - name: POSTGRES_DB
              value: todo_db
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
          ports:
            - containerPort: 5432

          readinessProbe:
            exec:
              command:
                - pg_isready
                - -h
                - "127.0.0.1"
                - -p
                - "5432"
            initialDelaySeconds: 5
            periodSeconds: 10



          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql
            - name: postgres-init
              mountPath: /docker-entrypoint-initdb.d/init.sql
              subPath: init.sql
              readOnly: true
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-data
        - name: postgres-init
          configMap:
            name: postgres-init
