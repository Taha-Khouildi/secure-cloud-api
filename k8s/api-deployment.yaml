apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi
  namespace: secure-cloud-api

spec:
  replicas: 1
  selector:
    matchLabels:
      app: fastapi
  template:
    metadata:
      labels:
        app: fastapi
    spec:

      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault



      containers:
       - name: fastapi
         securityContext:
           runAsNonRoot: true
           runAsUser: 10001
           allowPrivilegeEscalation: false
           readOnlyRootFilesystem: true
           capabilities:
             drop:
               - ALL

         image: ghcr.io/taha-khouildi/secure-cloud-api@sha256:df533118daac9271dd03e38c9d1489f8aac530a456f0976802d5e726dca4adad
         imagePullPolicy: IfNotPresent
         resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
         ports:
           - containerPort: 8000
         readinessProbe:
           httpGet:
             path: /health
             port: 8000
           initialDelaySeconds: 5
           periodSeconds: 10
         env:
           - name: DB_HOST
             value: "db"
           - name: DB_PORT
             value: "5432"
           - name: DB_NAME
             value: "todo_db"
           - name: DB_USER
             value: "todo_user"
           - name: DB_PASSWORD
             valueFrom:
               secretKeyRef:
                 name: postgres-secret
                 key: POSTGRES_PASSWORD
